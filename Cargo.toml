[package]
name = "lim"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lints.rust]
warnings = "deny"

[lib]
name = "lim"
path = "src/lib.rs"

[[bin]]
name = "lim"
path = "src/main.rs"

[[bench]]
name = "compiler"
path = "benches/compiler.rs"
harness = false

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

[workspace]
members = ["browser"]
default-members = ["."]
resolver = "2"

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 8
